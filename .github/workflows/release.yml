# On a version tag (v0.1.0, ...): builds the installer, signs the update files and creates a DRAFT
# GitHub release with both. Nothing is public until the owner publishes the draft by hand.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release and upload files to it
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update files, so installed copies only accept updates made with the owner's key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Update files only here: local builds have no signing key.
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Traywise ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what's new. Windows may warn that the installer is unrecognised; click "More info", then "Run anyway".
          releaseDraft: true
          # latest.json is what installed copies check; it goes live only when the draft is published.
          includeUpdaterJson: true
